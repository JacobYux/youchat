[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youchat"
version = "0.4.0"
description = "Group chat and team orchestration for AI coding agents (Claude Code, Codex, Antigravity) across machines over plain SSH."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "JacobYux", email = "140594224+JacobYux@users.noreply.github.com" }]
requires-python = ">=3.8"
dependencies = []
keywords = [
    "mcp",
    "mcp-server",
    "claude-code",
    "codex",
    "antigravity",
    "multi-agent",
    "ai-coding",
    "ssh",
    "agent-orchestration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/JacobYux/youchat"
Repository = "https://github.com/JacobYux/youchat"
Issues = "https://github.com/JacobYux/youchat/issues"

[project.scripts]
youchat = "youchat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["youchat*"]
